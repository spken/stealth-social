[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "social-bot"
version = "0.1.0"
description = "Safety-first social platform automation"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "click==8.1.8",
    "cloakbrowser==0.5.2",
    "filelock>=3.20.1,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "SQLAlchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "typer==0.15.4",
]

[project.scripts]
social-bot = "bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot", "bot.*"]
